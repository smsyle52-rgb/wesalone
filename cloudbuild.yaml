substitutions:
  _REGION: us-central1
  _SERVICE: khadamatak-staging
  _REPOSITORY: khadamatak
  _IMAGE: app
  _DATABASE_URL_SECRET: DATABASE_URL
  _DB_CONNECTION_NAME: khadamatk-auth:us-central1:khadamatak-prod
  _CLOUDSQL_INSTANCE: khadamatk-auth:us-central1:khadamatak-prod
  _PUBLIC_BASE_URL: https://khadamatak-staging-1067617934225.us-central1.run.app

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

  - id: enable-vertex-ai
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - services
      - enable
      - aiplatform.googleapis.com
      - --project=${PROJECT_ID}
      - --quiet

  - id: migrate-database
    name: postgres:15-alpine
    entrypoint: sh
    secretEnv:
      - DATABASE_URL
    args:
      - -ceu
      - |
        test -s scripts/migrate-phase345.sql
        wget -q https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64 -O /tmp/cloud-sql-proxy
        chmod +x /tmp/cloud-sql-proxy
        /tmp/cloud-sql-proxy "${_DB_CONNECTION_NAME}" --port=5433 >/tmp/cloud-sql-proxy.log 2>&1 &
        PROXY_PID=$$!
        cleanup() {
          kill "$${PROXY_PID}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        sleep 4

        _DATABASE_URL="$${DATABASE_URL#\"}"
        _DATABASE_URL="$${_DATABASE_URL%\"}"
        _DATABASE_URL="$${_DATABASE_URL%%\?*}"
        _DATABASE_URL="$${_DATABASE_URL#postgresql://}"
        _DATABASE_URL="$${_DATABASE_URL#postgres://}"
        _DATABASE_URL="$$(printf '%s' "$${_DATABASE_URL}" | sed -E 's#^([^@]+)@(/|[^/]+/)#\1@127.0.0.1:5433/#')"
        _DATABASE_URL="postgresql://$${_DATABASE_URL}"

        PAGER=cat psql -P pager=off --no-psqlrc -v ON_ERROR_STOP=1 "$${_DATABASE_URL}" -f scripts/migrate-phase345.sql

  - id: verify-migration
    name: postgres:15-alpine
    entrypoint: sh
    secretEnv:
      - DATABASE_URL
    args:
      - -ceu
      - |
        wget -q https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64 -O /tmp/cloud-sql-proxy
        chmod +x /tmp/cloud-sql-proxy
        /tmp/cloud-sql-proxy "${_DB_CONNECTION_NAME}" --port=5433 >/tmp/cloud-sql-proxy-verify.log 2>&1 &
        PROXY_PID=$$!
        cleanup() {
          kill "$${PROXY_PID}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        sleep 4

        _DATABASE_URL="$${DATABASE_URL#\"}"
        _DATABASE_URL="$${_DATABASE_URL%\"}"
        _DATABASE_URL="$${_DATABASE_URL%%\?*}"
        _DATABASE_URL="$${_DATABASE_URL#postgresql://}"
        _DATABASE_URL="$${_DATABASE_URL#postgres://}"
        _DATABASE_URL="$$(printf '%s' "$${_DATABASE_URL}" | sed -E 's#^([^@]+)@(/|[^/]+/)#\1@127.0.0.1:5433/#')"
        _DATABASE_URL="postgresql://$${_DATABASE_URL}"

        VERIFY_RESULT="$$(PAGER=cat psql -P pager=off --no-psqlrc -v ON_ERROR_STOP=1 -tA "$${_DATABASE_URL}" -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('domain_events','agent_memory_snapshots','auto_reply_decisions','whatsapp_templates','broadcasts','automations');" | tr -d '[:space:]')"
        test "$${VERIFY_RESULT}" = "6"

  - id: deploy-staging
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - --region=$_REGION
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --add-cloudsql-instances=$_CLOUDSQL_INSTANCE
      - --set-env-vars=^|^NODE_ENV=production|SERVE_STATIC=true|AI_PROVIDER=vertex|VERTEX_PROJECT_ID=${PROJECT_ID}|VERTEX_LOCATION=${_REGION}|VERTEX_MODEL=gemini-2.5-flash|AI_MAX_OUTPUT_TOKENS=2048|AI_TEMPERATURE=0.2|PUBLIC_BASE_URL=https://www.wesal.one|ALLOWED_ORIGINS=https://www.wesal.one,https://wesal.one,https://khadamatak-staging-1067617934225.us-central1.run.app|META_APP_ID=1437258534807702|META_GRAPH_VERSION=v22.0|META_WHATSAPP_STANDARD_CONFIG_ID=845347748296104|META_WHATSAPP_COEXISTENCE_CONFIG_ID=1375409704475660|META_INSTAGRAM_MESSENGER_CONFIG_ID=2181802019272074|META_FACEBOOK_CONTENT_CONFIG_ID=27444093488614246
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,SESSION_SECRET=SESSION_SECRET:latest,META_APP_SECRET=meta-app-secret:latest,META_SYSTEM_USER_TOKEN=META_SYSTEM_USER_TOKEN:latest,META_WEBHOOK_SECRET=META_WEBHOOK_SECRET:latest,META_WEBHOOK_VERIFY_TOKEN=meta-webhook-verify-token:latest
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_DATABASE_URL_SECRET}/versions/latest
      env: DATABASE_URL
