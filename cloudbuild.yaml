substitutions:
  _REGION: us-central1
  _SERVICE: khadamatak-staging
  _REPOSITORY: khadamatak
  _IMAGE: app
  _DATABASE_URL_SECRET: DATABASE_URL
  _DB_CONNECTION_NAME: khadamatk-auth:us-central1:khadamatak-prod
  _CLOUDSQL_INSTANCE: khadamatk-auth:us-central1:khadamatak-prod
  _PUBLIC_BASE_URL: https://khadamatak-staging-1067617934225.us-central1.run.app
  _UPLOADS_BUCKET: khadamatak-auth-uploads

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

  - id: enable-vertex-ai
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - services
      - enable
      - aiplatform.googleapis.com
      - --project=${PROJECT_ID}
      - --quiet

  - id: migrate-database
    name: postgres:15-alpine
    entrypoint: sh
    secretEnv:
      - DATABASE_URL
    args:
      - -ceu
      - |
        test -s scripts/migrate-phase345.sql
        wget -q https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64 -O /tmp/cloud-sql-proxy
        chmod +x /tmp/cloud-sql-proxy
        /tmp/cloud-sql-proxy "${_DB_CONNECTION_NAME}" --port=5433 >/tmp/cloud-sql-proxy.log 2>&1 &
        PROXY_PID=$$!
        cleanup() {
          kill "$${PROXY_PID}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        sleep 4

        _DATABASE_URL="$${DATABASE_URL#\"}"
        _DATABASE_URL="$${_DATABASE_URL%\"}"
        _DATABASE_URL="$${_DATABASE_URL%%\?*}"
        _DATABASE_URL="$${_DATABASE_URL#postgresql://}"
        _DATABASE_URL="$${_DATABASE_URL#postgres://}"
        _DATABASE_URL="$$(printf '%s' "$${_DATABASE_URL}" | sed -E 's#^([^@]+)@(/|[^/]+/)#\1@127.0.0.1:5433/#')"
        _DATABASE_URL="postgresql://$${_DATABASE_URL}"

        PAGER=cat psql -P pager=off --no-psqlrc -v ON_ERROR_STOP=1 "$${_DATABASE_URL}" -f scripts/migrate-phase345.sql

  - id: verify-migration
    name: postgres:15-alpine
    entrypoint: sh
    secretEnv:
      - DATABASE_URL
    args:
      - -ceu
      - |
        wget -q https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64 -O /tmp/cloud-sql-proxy
        chmod +x /tmp/cloud-sql-proxy
        /tmp/cloud-sql-proxy "${_DB_CONNECTION_NAME}" --port=5433 >/tmp/cloud-sql-proxy-verify.log 2>&1 &
        PROXY_PID=$$!
        cleanup() {
          kill "$${PROXY_PID}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        sleep 4

        _DATABASE_URL="$${DATABASE_URL#\"}"
        _DATABASE_URL="$${_DATABASE_URL%\"}"
        _DATABASE_URL="$${_DATABASE_URL%%\?*}"
        _DATABASE_URL="$${_DATABASE_URL#postgresql://}"
        _DATABASE_URL="$${_DATABASE_URL#postgres://}"
        _DATABASE_URL="$$(printf '%s' "$${_DATABASE_URL}" | sed -E 's#^([^@]+)@(/|[^/]+/)#\1@127.0.0.1:5433/#')"
        _DATABASE_URL="postgresql://$${_DATABASE_URL}"

        VERIFY_TABLES="$$(PAGER=cat psql -P pager=off --no-psqlrc -v ON_ERROR_STOP=1 -tA "$${_DATABASE_URL}" -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('domain_events','agent_memory_snapshots','auto_reply_decisions','whatsapp_templates','broadcasts','automations','workspace_sequences');" | tr -d '[:space:]')"
        test "$${VERIFY_TABLES}" = "7"

        VERIFY_COLS="$$(PAGER=cat psql -P pager=off --no-psqlrc -v ON_ERROR_STOP=1 -tA "$${_DATABASE_URL}" -c "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND ((table_name='conversations' AND column_name IN ('display_id','lifecycle_state','ai_substate','labels','waiting_since','first_reply_created_at')) OR (table_name='messages' AND column_name IN ('message_type','content_attributes')) OR (table_name='channel_accounts' AND column_name IN ('external_account_id','external_business_id','external_phone_id','health_status','last_health_at')) OR (table_name='outbox_events' AND column_name IN ('provider_account_id','channel_account_id','failed_at')));" | tr -d '[:space:]')"
        test "$${VERIFY_COLS}" = "16"

        # L1: launch-critical schema guard — fail loudly AND name the gap on drift, instead of silent breakage.
        # Only objects guaranteed present post-migrate (base tables the live app requires, or created by migrate-phase345.sql).
        MISSING_TABLES="$$(PAGER=cat psql -P pager=off --no-psqlrc -v ON_ERROR_STOP=1 -tA "$${_DATABASE_URL}" -c "SELECT string_agg(x, ',') FROM unnest(ARRAY['workspaces','users','channel_accounts','contacts','conversations','messages','domain_events','ai_agents','orders','order_items','products','inventory_products','payment_submissions','point_wallets','point_ledger']) AS x WHERE x NOT IN (SELECT tablename FROM pg_tables WHERE schemaname='public')")"
        if [ -n "$${MISSING_TABLES}" ]; then echo "SCHEMA DRIFT (launch-critical) — missing tables: $${MISSING_TABLES}"; exit 1; fi

        MISSING_COLS2="$$(PAGER=cat psql -P pager=off --no-psqlrc -v ON_ERROR_STOP=1 -tA "$${_DATABASE_URL}" -c "SELECT string_agg(t||'.'||c, ',') FROM (VALUES ('contacts','custom_fields')) AS v(t,c) WHERE NOT EXISTS (SELECT 1 FROM information_schema.columns col WHERE col.table_schema='public' AND col.table_name=v.t AND col.column_name=v.c)")"
        if [ -n "$${MISSING_COLS2}" ]; then echo "SCHEMA DRIFT (launch-critical) — missing columns: $${MISSING_COLS2}"; exit 1; fi

  - id: deploy-staging
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - --region=$_REGION
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=1
      - --add-cloudsql-instances=$_CLOUDSQL_INSTANCE
      - --set-env-vars=^|^NODE_ENV=production|SERVE_STATIC=true|AI_PROVIDER=vertex|VERTEX_PROJECT_ID=${PROJECT_ID}|VERTEX_LOCATION=${_REGION}|VERTEX_MODEL=gemini-2.5-flash|AI_MAX_OUTPUT_TOKENS=2048|AI_TEMPERATURE=0.2|MODEL_TEXT_NORMAL=gemini-3-flash-preview|MODEL_TEXT_HARD=gemini-3.1-pro-preview|MODEL_VISION_NORMAL=gemini-3-flash-preview|MODEL_VISION_HARD=gemini-3.1-pro-preview|MODEL_VOICE_NORMAL=gemini-3-flash-preview|MODEL_VOICE_HARD=gemini-3.1-pro-preview|PUBLIC_BASE_URL=https://www.wesal.one|EMAIL_FROM=وصال ون <support@wesal.one>|ALLOWED_ORIGINS=https://www.wesal.one,https://wesal.one,https://khadamatak-staging-1067617934225.us-central1.run.app|META_APP_ID=1437258534807702|META_GRAPH_VERSION=v22.0|META_WHATSAPP_STANDARD_CONFIG_ID=845347748296104|META_WHATSAPP_COEXISTENCE_CONFIG_ID=1375409704475660|META_INSTAGRAM_MESSENGER_CONFIG_ID=2181802019272074|META_FACEBOOK_CONTENT_CONFIG_ID=27444093488614246|UPLOADS_BUCKET=${_UPLOADS_BUCKET}
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,SESSION_SECRET=SESSION_SECRET:latest,META_APP_SECRET=meta-app-secret:latest,META_SYSTEM_USER_TOKEN=META_SYSTEM_USER_TOKEN:latest,META_WEBHOOK_SECRET=META_WEBHOOK_SECRET:latest,META_WEBHOOK_VERIFY_TOKEN=meta-webhook-verify-token:latest,INTERNAL_SECRET=INTERNAL_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_DATABASE_URL_SECRET}/versions/latest
      env: DATABASE_URL
