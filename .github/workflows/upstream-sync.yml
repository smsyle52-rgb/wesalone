name: Upstream Sync (ChatbotX)

# Weekly (and on-demand) check for new ChatbotX upstream commits. Attempts an
# automatic merge, auto-resolves only the two permanently-known TimescaleDB
# conflicts (see packages/database/drizzle-wesal/README.md), typechecks the
# result, and — if that passes — pushes straight to release/wesal-one-next,
# which auto-deploys to production at 100% traffic (no canary, no human
# review gate). This is a deliberate choice, made with the risk spelled out:
# the same no-canary deploy path already broke prod once before from a human
# push, and this makes it fire from upstream commits nobody here reviewed.
# Typecheck failure and unexpected merge conflicts are the only brakes — both
# stop before touching release/wesal-one-next and file an issue instead.
#
# Migrations are NEVER auto-applied here, full stop — that rule doesn't bend
# for this workflow. New migration files just get listed in the sync issue
# for someone to apply by hand.

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_URL: https://github.com/ChatbotXIO/ChatbotX.git
  BASE_BRANCH: release/wesal-one-next
  KNOWN_CONFLICT_FILES: |
    packages/database/drizzle/20260517074023_migrate_analytics_to_timescaledb_table/migration.sql
    packages/database/drizzle/20260622040000_align_message_attachment_to_shard_schema/migration.sql

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BASE_BRANCH }}

      - name: Configure git identity
        run: |
          git config user.name "upstream-sync-bot"
          git config user.email "actions@github.com"

      - name: Add upstream remote
        run: git remote add upstream "$UPSTREAM_URL" 2>/dev/null || true

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          count=$(git rev-list --count HEAD..upstream/main)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count new upstream commit(s)."

      - name: Attempt merge
        if: steps.check.outputs.count != '0'
        id: merge
        run: |
          set +e
          branch="upstream-sync/$(date +%Y-%m-%d)"
          git checkout -b "$branch"

          git merge upstream/main --no-edit
          merge_status=$?

          if [ "$merge_status" -ne 0 ]; then
            conflicted=$(git diff --name-only --diff-filter=U | sort -u)
            known=$(echo "$KNOWN_CONFLICT_FILES" | sed '/^$/d' | sort -u)
            unexpected=$(comm -23 <(echo "$conflicted") <(echo "$known"))

            if [ -n "$unexpected" ]; then
              echo "status=conflict" >> "$GITHUB_OUTPUT"
              {
                echo "unexpected<<EOF"
                echo "$unexpected"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              git merge --abort
              exit 0
            fi

            # Only the known, permanently-accepted TimescaleDB files conflicted.
            # Resolution is fixed: keep our Cloud-SQL-compatible version.
            echo "$KNOWN_CONFLICT_FILES" | sed '/^$/d' | while read -r f; do
              if echo "$conflicted" | grep -qxF "$f"; then
                git checkout --ours "$f"
                git add "$f"
              fi
            done
            git commit --no-edit
          fi

          echo "status=merged" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: List new upstream migrations (for reviewer visibility only)
        if: steps.merge.outputs.status == 'merged'
        id: migrations
        run: |
          new_migrations=$(git diff --name-status "origin/$BASE_BRANCH"..HEAD -- packages/database/drizzle/ | awk '$1=="A"{print $2}')
          {
            echo "list<<EOF"
            echo "${new_migrations:-(none)}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.merge.outputs.status == 'merged'
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.status == 'merged'
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.merge.outputs.status == 'merged'
        run: pnpm install --frozen-lockfile

      - name: Typecheck builder
        if: steps.merge.outputs.status == 'merged'
        id: typecheck
        run: |
          set +e
          pnpm --filter builder check-types
          echo "result=$?" >> "$GITHUB_OUTPUT"

      - name: Deploy — push straight to release/wesal-one-next
        if: steps.merge.outputs.status == 'merged' && steps.typecheck.outputs.result == '0'
        run: git push origin "HEAD:$BASE_BRANCH"

      - name: Log a deploy record (informational only, not a gate)
        if: steps.merge.outputs.status == 'merged' && steps.typecheck.outputs.result == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream sync auto-deployed: ChatbotX $(date +%Y-%m-%d)" \
            --body "Merged ChatbotXIO/ChatbotX main and pushed straight to \`$BASE_BRANCH\` — this is already live at 100% traffic, no review step ran.

**New upstream migrations in this deploy — NOT auto-applied, apply by hand when ready:**
\`\`\`
${{ steps.migrations.outputs.list }}
\`\`\`

**Auto-resolved (kept our Cloud-SQL-compatible version, per drizzle-wesal/README.md):**
- 20260517074023_migrate_analytics_to_timescaledb_table/migration.sql
- 20260622040000_align_message_attachment_to_shard_schema/migration.sql

Check the service directly if anything looks off: https://console.cloud.google.com/run/detail/us-central1/wesal-one-next-builder"

      - name: File a blocking issue when typecheck fails
        if: steps.merge.outputs.status == 'merged' && steps.typecheck.outputs.result != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${{ steps.merge.outputs.branch }}"
          git push origin "$branch" --force-with-lease
          gh issue create \
            --title "Upstream sync NOT deployed — typecheck failed $(date +%Y-%m-%d)" \
            --body "Merged ChatbotXIO/ChatbotX main cleanly but \`pnpm --filter builder check-types\` failed, so nothing was pushed to \`$BASE_BRANCH\` — prod is unchanged.

Merged branch (not deployed): \`$branch\`. Fix the type errors there and push to \`$BASE_BRANCH\` by hand when ready."

      - name: File an issue when conflicts need a human
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream sync blocked: unexpected conflicts $(date +%Y-%m-%d)" \
            --body "Automated sync from ChatbotXIO/ChatbotX hit conflicts outside the two known TimescaleDB files and stopped without merging, pushing, or deploying anything. Prod is unchanged.

Conflicted files:
\`\`\`
${{ steps.merge.outputs.unexpected }}
\`\`\`

Resolve manually: \`bash scripts/update-from-upstream.sh --merge\`, fix conflicts, then push."
