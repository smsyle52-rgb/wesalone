name: Azure Container Apps

on:
  push:
    branches:
      - release/wesal-one-next
      - chore/chatbotx-azure-20260814
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built commit to Azure staging resources
        required: true
        default: false
        type: boolean
      rollback_revision:
        description: Optional active revision name to restore for all specified apps
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: wesal-azure-containerapps
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: 02b98259-3e80-4cf5-87b3-6cc6968d06f0
  AZURE_TENANT_ID: 30a49e5c-d762-4170-beac-5bdfd2aa7c9e
  AZURE_SUBSCRIPTION_ID: 4dad6f21-8881-4379-9379-d6f220ed9fc0
  AZURE_RESOURCE_GROUP: rg-wesal-migration-uae
  AZURE_CONTAINER_REGISTRY: acrwesaluae4dad6f
  AZURE_CONTAINERAPPS_ENVIRONMENT: cae-wesal-migration-uae
  AZURE_KEY_VAULT: kv-wesal-uae-4dad6f
  AZURE_CONTAINER_IDENTITY: /subscriptions/4dad6f21-8881-4379-9379-d6f220ed9fc0/resourceGroups/rg-wesal-migration-uae/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wesal-containerapps

jobs:
  build:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: builder
            dockerfile: apps/builder/docker/Dockerfile
          - service: worker
            dockerfile: apps/worker/docker/Dockerfile
          - service: realtime
            dockerfile: apps/realtime/docker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Obtain short-lived registry access token
        id: acr-token
        shell: bash
        run: |
          set -euo pipefail
          echo "accessToken=$(az acr login --name "$AZURE_CONTAINER_REGISTRY" --expose-token --query accessToken --output tsv)" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr-token.outputs.accessToken }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/wesal/${{ matrix.service }}:${{ github.sha }}
            ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/wesal/${{ matrix.service }}:candidate
          cache-from: type=gha,scope=wesal-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=wesal-${{ matrix.service }}

  deploy:
    name: Deploy verified staging revision
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy &&
      inputs.rollback_revision == ''
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          required_secrets=(
            database-url redis-url azure-storage-connection-string
            azure-openai-api-key azure-openai-endpoint
            better-auth-secret encryption-key realtime-broadcast-secret
          )
          for name in "${required_secrets[@]}"; do
            az keyvault secret show --vault-name "$AZURE_KEY_VAULT" --name "$name" --query id --output tsv >/dev/null
          done
          for app in wesal-builder wesal-worker wesal-realtime; do
            az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$app" --output none
          done

      - name: Update revisions without migrations
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update --resource-group "$AZURE_RESOURCE_GROUP" --name wesal-builder \
            --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/wesal/builder:${GITHUB_SHA}" \
            --set-env-vars RUN_DB_MIGRATE=false RUN_DB_SEED=false
          az containerapp update --resource-group "$AZURE_RESOURCE_GROUP" --name wesal-worker \
            --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/wesal/worker:${GITHUB_SHA}"
          az containerapp update --resource-group "$AZURE_RESOURCE_GROUP" --name wesal-realtime \
            --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/wesal/realtime:${GITHUB_SHA}"

      - name: Smoke test public staging endpoints
        shell: bash
        run: |
          set -euo pipefail
          for app in wesal-builder wesal-realtime; do
            host=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$app" --query properties.configuration.ingress.fqdn --output tsv)
            test -n "$host"
            curl --fail --silent --show-error --retry 5 --retry-delay 5 "https://${host}/" >/dev/null
          done

  rollback:
    name: Restore a prior revision
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.rollback_revision != ''
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Restore named revision
        shell: bash
        run: |
          set -euo pipefail
          for app in wesal-builder wesal-worker wesal-realtime; do
            az containerapp revision activate \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --container-app "$app" \
              --revision "${{ inputs.rollback_revision }}"
          done
