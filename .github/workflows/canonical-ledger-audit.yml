name: Canonical Ledger Drift Audit

on:
  push:
    branches:
      - chore/canonical-ledger-audit-ci
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  audit:
    name: Prove ledger/schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_local_only
      ADMIN_DB_URL: postgresql://postgres:ci_local_only@localhost:5432/postgres
      LEDGER_DB_URL: postgresql://postgres:ci_local_only@localhost:5432/ledger_db
      SCHEMA_DB_URL: postgresql://postgres:ci_local_only@localhost:5432/schema_db
      AUDIT_DIR: canonical-ledger-audit
      NODE_ENV: test
      CI: "true"

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical ledger audit
        id: audit
        run: |
          chmod +x scripts/verify-canonical-ledger.sh
          scripts/verify-canonical-ledger.sh

      - name: Append audit summary
        if: always()
        run: |
          if [ -f canonical-ledger-audit/workflow-summary.txt ]; then
            cat canonical-ledger-audit/workflow-summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "canonical-ledger-audit/workflow-summary.txt was not produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload canonical ledger audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-ledger-audit
          path: canonical-ledger-audit/**
          retention-days: 3
          if-no-files-found: warn
