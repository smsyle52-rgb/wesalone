name: Commerce Safety Gate

on:
  push:
    branches:
      - feat/commerce-inventory-orders-payments
  pull_request:
    branches:
      - main

concurrency:
  group: commerce-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/commerce_fresh

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create migration databases
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE commerce_fresh;
          CREATE DATABASE commerce_old;
          SQL

      - name: Migrate empty database
        id: migrate_fresh
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/commerce_fresh
        run: |
          set +e
          pnpm --filter @workspace/db migrate > /tmp/migrate-fresh.log 2>&1
          status=$?
          cat /tmp/migrate-fresh.log
          exit "$status"

      - name: Migrate old main database then upgrade with branch migrations
        id: migrate_old
        continue-on-error: true
        run: |
          set +e
          {
            git worktree add /tmp/khadamatak-main origin/main
            cd /tmp/khadamatak-main
            pnpm install --frozen-lockfile
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/commerce_old pnpm --filter @workspace/db migrate
            cd "$GITHUB_WORKSPACE"
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/commerce_old pnpm --filter @workspace/db migrate
          } > /tmp/migrate-old.log 2>&1
          status=$?
          cat /tmp/migrate-old.log
          exit "$status"

      - name: Verify migration results
        id: verify_migrations
        if: steps.migrate_fresh.outcome == 'success' && steps.migrate_old.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          {
            for db in commerce_fresh commerce_old; do
              psql "postgresql://postgres:postgres@localhost:5432/$db" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT idempotency_key FROM order_state_transitions LIMIT 0;
          SELECT slug FROM permissions WHERE slug = 'payments:refund';
          SQL
            done
          } > /tmp/verify-migrations.log 2>&1
          status=$?
          cat /tmp/verify-migrations.log
          exit "$status"

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          pnpm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          exit "$status"

      - name: Run unit and PostgreSQL integration tests
        id: tests
        if: steps.migrate_fresh.outcome == 'success'
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/commerce_fresh
        run: |
          set +e
          pnpm --filter @workspace/api-server test > /tmp/tests.log 2>&1
          status=$?
          cat /tmp/tests.log
          exit "$status"

      - name: Build API
        id: build_api
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @workspace/api-server build > /tmp/build-api.log 2>&1
          status=$?
          cat /tmp/build-api.log
          exit "$status"

      - name: Build web
        id: build_web
        continue-on-error: true
        env:
          BASE_PATH: /
        run: |
          set +e
          pnpm --filter @workspace/web build > /tmp/build-web.log 2>&1
          status=$?
          cat /tmp/build-web.log
          exit "$status"

      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-safety-diagnostics
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Evaluate Commerce Safety Gate
        if: always()
        run: |
          failed=0
          check() {
            name="$1"
            outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "::error title=$name::$name outcome was $outcome"
              failed=1
            fi
          }
          check "fresh migration" "${{ steps.migrate_fresh.outcome }}"
          check "old database migration" "${{ steps.migrate_old.outcome }}"
          check "migration verification" "${{ steps.verify_migrations.outcome }}"
          check "typecheck" "${{ steps.typecheck.outcome }}"
          check "tests" "${{ steps.tests.outcome }}"
          check "API build" "${{ steps.build_api.outcome }}"
          check "web build" "${{ steps.build_web.outcome }}"
          exit "$failed"
