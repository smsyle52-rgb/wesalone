# Wesal: build the worker image on a GitHub runner, so a daytime deploy never
# builds on the production server. Published as a pre-release asset the server
# downloads, checks with sha256sum and loads with `docker load`.
name: wesal-worker-image

on:
  push:
    branches: [wesal/wa-bridge]
    paths-ignore:
      - "wesal-ops/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Build worker image
        run: |
          TAG=wab-${GITHUB_SHA::9}
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          DOCKER_BUILDKIT=1 docker build -f apps/worker/docker/Dockerfile -t wesal/worker:$TAG .
          docker image ls wesal/worker

      - name: Save image
        run: |
          docker save wesal/worker:$TAG | gzip -1 > worker-$TAG.tar.gz
          sha256sum worker-$TAG.tar.gz | tee worker-$TAG.tar.gz.sha256
          ls -lh worker-$TAG.tar.gz

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "imgw-$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "worker image $TAG (deploy artifact, temporary)" \
            --notes "Temporary deploy artifact. Deleted after the server loads it." \
            worker-$TAG.tar.gz worker-$TAG.tar.gz.sha256
