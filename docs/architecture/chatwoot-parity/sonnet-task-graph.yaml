      channel identities, which is what actually identifies a person. Audit log entry is
      severity=critical and never carries the pre-erasure name/phone/email.
      Correlation-id: added domain_events.correlation_id (migration 0036, additive/nullable).
      Threaded from meta.routes.ts's live webhook POST handler (not the INGEST_DEFERRED branch,
      which already had its own separate correlationId) through handleMetaPayload ->
      handleInboundMessage/handleEchoEvent -> createDomainEvent, and logged at both success and
