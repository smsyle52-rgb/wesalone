      Verified, not touched.
      Right-to-erasure: added POST /contacts/:id/erase (contacts:delete permission, matching
      the existing archive endpoint's permission level). Redacts in place rather than deleting
      the row — name/phone/email/city/locationNote/company/customFields on contacts, plus
      identifier/normalizedIdentifier on every linked contact_channels row — so conversations,
      messages, orders, and audit history that reference this contactId stay intact. Did not
