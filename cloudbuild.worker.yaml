substitutions:
  _REGION: us-central1
  _SERVICE: khadamatak-outbox-worker
  _REPOSITORY: khadamatak
  _IMAGE: outbox-worker
  _DB_CONNECTION_NAME: khadamatk-auth:us-central1:khadamatak-prod

steps:
  - id: build-worker-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.worker
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$SHORT_SHA
      - .

  - id: push-worker-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$SHORT_SHA

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8080
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      - --add-cloudsql-instances=$_DB_CONNECTION_NAME
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,SESSION_SECRET=SESSION_SECRET:latest,META_APP_SECRET=meta-app-secret:latest,META_SYSTEM_USER_TOKEN=META_SYSTEM_USER_TOKEN:latest,META_WEBHOOK_SECRET=META_WEBHOOK_SECRET:latest,INTERNAL_SECRET=INTERNAL_SECRET:latest
      - --set-env-vars=NODE_ENV=production,API_SERVER_URL=https://khadamatak-staging-1067617934225.us-central1.run.app,AI_PROVIDER=vertex,VERTEX_PROJECT_ID=$PROJECT_ID,VERTEX_LOCATION=global,VERTEX_MODEL=gemini-2.5-flash,AI_MAX_OUTPUT_TOKENS=2048,AI_TEMPERATURE=0.2,WHATSAPP_BSUID_ENABLED=true
      - --quiet

  # حادثة 11 يوليو 2026: الـworker وُجد مثبَّتاً على نسخة متأخرة 20 نسخة عن الأحدث — محرك الرد
  # نفسه كان يشغّل كوداً قديماً لأيام رغم نجاح كل النشرات. هذه الخطوة تفرض عقد الخط بعد كل نشر.
  - id: force-traffic-to-latest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - $_SERVICE
      - --region=$_REGION
      - --to-latest
      - --quiet

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
