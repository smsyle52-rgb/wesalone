substitutions:
  _REGION: us-central1
  _SERVICE: khadamatak-outbox-worker
  _REPOSITORY: khadamatak
  _IMAGE: outbox-worker
  _DATABASE_URL_SECRET: DATABASE_URL
  _DB_CONNECTION_NAME: khadamatk-auth:us-central1:khadamatak-prod

steps:
  - id: build-worker-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.worker
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$SHORT_SHA
      - .

  - id: push-worker-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$SHORT_SHA

  - id: migrate-database
    name: postgres:15-alpine
    entrypoint: sh
    secretEnv:
      - DATABASE_URL
    args:
      - -ceu
      - |
        test -s scripts/migrate-phase345.sql
        wget -q https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64 -O /tmp/cloud-sql-proxy
        chmod +x /tmp/cloud-sql-proxy
        /tmp/cloud-sql-proxy "${_DB_CONNECTION_NAME}" --port=5433 >/tmp/cloud-sql-proxy.log 2>&1 &
        PROXY_PID=$!
        cleanup() {
          kill "${PROXY_PID}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        sleep 4

        _DATABASE_URL="${DATABASE_URL#\"}"
        _DATABASE_URL="${_DATABASE_URL%\"}"
        _DATABASE_URL="${_DATABASE_URL%%\?*}"
        _DATABASE_URL="${_DATABASE_URL#postgresql://}"
        _DATABASE_URL="${_DATABASE_URL#postgres://}"
        _DATABASE_URL="$(printf '%s' "${_DATABASE_URL}" | sed -E 's#^([^@]+)@(/|[^/]+/)#\1@127.0.0.1:5433/#')"
        _DATABASE_URL="postgresql://${_DATABASE_URL}"

        PAGER=cat psql -P pager=off --no-psqlrc -v ON_ERROR_STOP=1 "${_DATABASE_URL}" -f scripts/migrate-phase345.sql

  - id: verify-migration
    name: postgres:15-alpine
    entrypoint: sh
    secretEnv:
      - DATABASE_URL
    args:
      - -ceu
      - |
        wget -q https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64 -O /tmp/cloud-sql-proxy
        chmod +x /tmp/cloud-sql-proxy
        /tmp/cloud-sql-proxy "${_DB_CONNECTION_NAME}" --port=5433 >/tmp/cloud-sql-proxy-verify.log 2>&1 &
        PROXY_PID=$!
        cleanup() {
          kill "${PROXY_PID}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        sleep 4

        _DATABASE_URL="${DATABASE_URL#\"}"
        _DATABASE_URL="${_DATABASE_URL%\"}"
        _DATABASE_URL="${_DATABASE_URL%%\?*}"
        _DATABASE_URL="${_DATABASE_URL#postgresql://}"
        _DATABASE_URL="${_DATABASE_URL#postgres://}"
        _DATABASE_URL="$(printf '%s' "${_DATABASE_URL}" | sed -E 's#^([^@]+)@(/|[^/]+/)#\1@127.0.0.1:5433/#')"
        _DATABASE_URL="postgresql://${_DATABASE_URL}"

        VERIFY_RESULT="$(PAGER=cat psql -P pager=off --no-psqlrc -v ON_ERROR_STOP=1 -tA "${_DATABASE_URL}" -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('domain_events','agent_memory_snapshots','auto_reply_decisions','whatsapp_templates','broadcasts','automations');" | tr -d '[:space:]')"
        test "${VERIFY_RESULT}" = "6"

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8080
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest
      - --set-env-vars=NODE_ENV=production
      - --quiet

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$SHORT_SHA

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_DATABASE_URL_SECRET}/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY
