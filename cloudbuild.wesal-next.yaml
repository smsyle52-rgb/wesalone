timeout: 7200s

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-builder
    name: gcr.io/cloud-builders/docker
    args: [build, --file=apps/builder/docker/Dockerfile, --tag=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/builder:$SHORT_SHA, .]
  - id: push-builder
    name: gcr.io/cloud-builders/docker
    args: [push, us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/builder:$SHORT_SHA]
    waitFor: [build-builder]
  - id: deploy-builder
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, services, update, wesal-one-next-builder, --project=$PROJECT_ID, --region=us-central1, --image=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/builder:$SHORT_SHA, "--update-env-vars=VERTEX_AI_PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=global", --quiet]
    waitFor: [push-builder]

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args: [build, --file=apps/worker/docker/Dockerfile, --tag=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/worker:$SHORT_SHA, .]
  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args: [push, us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/worker:$SHORT_SHA]
    waitFor: [build-worker]
  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    # SMTP_SERVER/SMTP_FROM: the worker had no platform mail config at all —
    # SMTP_FROM was still a placeholder (noreply@wesal-one-next-staging.example)
    # and SMTP_SERVER was absent — so any platform email sent from a scheduled
    # job would have failed silently. Mirrors the builder's own wiring.
    args: [beta, run, worker-pools, update, wesal-one-next-worker, --project=$PROJECT_ID, --region=us-central1, --image=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/worker:$SHORT_SHA, "--update-env-vars=S3_ENDPOINT=https://storage.googleapis.com,S3_BUCKET=wesal-one-next-uploads,VERTEX_AI_PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=global,SMTP_FROM=Wesal One <support@wesal.one>", "--update-secrets=SMTP_SERVER=BREVO_SMTP_SERVER:latest", --quiet]
    waitFor: [push-worker]

  - id: build-realtime
    name: gcr.io/cloud-builders/docker
    args: [build, --file=apps/realtime/docker/Dockerfile, --tag=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/realtime:$SHORT_SHA, .]
  - id: push-realtime
    name: gcr.io/cloud-builders/docker
    args: [push, us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/realtime:$SHORT_SHA]
    waitFor: [build-realtime]
  - id: deploy-realtime
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, services, update, wesal-one-next-realtime, --project=$PROJECT_ID, --region=us-central1, --image=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/realtime:$SHORT_SHA, --quiet]
    waitFor: [push-realtime]

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/builder:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/worker:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/realtime:$SHORT_SHA
