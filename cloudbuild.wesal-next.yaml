timeout: 7200s

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY

substitutions:
  # `shadow` records real usage on BillableUsageEvent and settles it, but never
  # debits a wallet — the debit and the insufficient-balance refusal are both
  # gated on `enforce` in packages/business/src/usage-metering/service.ts. It
  # was pinned to `off` until the billing migrations and the read-only audit
  # were done: the migrations went in on 27 Jul and the audit ran on 30 Jul
  # (ok:false, on subscription coverage, not on ledger integrity).
  #
  # Pinned here rather than left as a manual env-var edit on the worker-pool,
  # because every deploy re-applies this value: setting it by hand meant the
  # next deploy silently stopped the metering with no error and no sign, and
  # the usage numbers we are collecting to price the plans would just quietly
  # stop.
  #
  # Do NOT move this to `enforce` yet. 31 of 35 workspace owners have no
  # PlatformSubscription and so no monthly grant, and there is still no
  # merchant notice or customer-facing message when a reply is refused for
  # lack of points — enforcing today reads to a merchant as the agent going
  # silent. See docs/billing-operations.md.
  #
  # Quoted: bare `off`/`on` is a YAML boolean, and Cloud Build rejects a
  # non-string substitution value ("cannot unmarshal bool into Go value of
  # type string"), which fails the whole config before any step runs.
  _AI_POINTS_ENFORCEMENT_MODE: "shadow"

steps:
  - id: build-builder
    name: gcr.io/cloud-builders/docker
    args: [build, --file=apps/builder/docker/Dockerfile, --tag=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/builder:$SHORT_SHA, .]
  - id: push-builder
    name: gcr.io/cloud-builders/docker
    args: [push, us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/builder:$SHORT_SHA]
    waitFor: [build-builder]
  - id: deploy-builder
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, services, update, wesal-one-next-builder, --project=$PROJECT_ID, --region=us-central1, --image=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/builder:$SHORT_SHA, "--update-env-vars=VERTEX_AI_PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=global", --quiet]
    waitFor: [push-builder]

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args: [build, --file=apps/worker/docker/Dockerfile, --tag=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/worker:$SHORT_SHA, .]
  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args: [push, us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/worker:$SHORT_SHA]
    waitFor: [build-worker]
  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    # SMTP_SERVER/SMTP_FROM: the worker had no platform mail config at all —
    # SMTP_FROM was still a placeholder (noreply@wesal-one-next-staging.example)
    # and SMTP_SERVER was absent — so any platform email sent from a scheduled
    # job would have failed silently. Mirrors the builder's own wiring.
    args: [beta, run, worker-pools, update, wesal-one-next-worker, --project=$PROJECT_ID, --region=us-central1, --image=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/worker:$SHORT_SHA, "--update-env-vars=S3_ENDPOINT=https://storage.googleapis.com,S3_BUCKET=wesal-one-next-uploads,VERTEX_AI_PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=global,SMTP_FROM=Wesal One <support@wesal.one>,AI_POINTS_ENFORCEMENT_MODE=${_AI_POINTS_ENFORCEMENT_MODE},TOKENS_PER_POINT=1000,AI_POINTS_RESERVATION_TTL_MINUTES=30", "--update-secrets=SMTP_SERVER=BREVO_SMTP_SERVER:latest", --quiet]
    waitFor: [push-worker]

  - id: build-realtime
    name: gcr.io/cloud-builders/docker
    args: [build, --file=apps/realtime/docker/Dockerfile, --tag=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/realtime:$SHORT_SHA, .]
  - id: push-realtime
    name: gcr.io/cloud-builders/docker
    args: [push, us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/realtime:$SHORT_SHA]
    waitFor: [build-realtime]
  - id: deploy-realtime
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, services, update, wesal-one-next-realtime, --project=$PROJECT_ID, --region=us-central1, --image=us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/realtime:$SHORT_SHA, --quiet]
    waitFor: [push-realtime]

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/builder:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/worker:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/chatbotx/realtime:$SHORT_SHA
